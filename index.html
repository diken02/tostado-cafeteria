<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · Tostado</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="login-page">
  <section class="login-hero">
    <h1>☕ Tostado</h1>
    <p>Sistema de gestión para cafetería: inventario, mesas, punto de venta, reportes y equipo en un solo lugar.</p>
  </section>
  <section class="login-form">
    <form class="card" action="admin.html">
      <h2>Bienvenido</h2>
      <p style="color:var(--suave)">Ingresa para continuar (demo visual, sin autenticación).</p>
      <div class="form-row"><label for="u">Correo</label><input id="u" type="email" placeholder="usuario@tostado.com"></div>
      <div class="form-row"><label for="p">Contraseña</label><input id="p" type="password" placeholder="••••••••"></div>
      <div class="form-row"><label style="font-weight:400"><input type="checkbox" style="width:auto"> Recordarme</label></div>
      <button class="btn block" type="submit">Iniciar sesión</button>
      <p style="text-align:center;font-size:.85rem"><a href="#">¿Olvidaste tu contraseña?</a></p>
    </form>
  </section>
</div>
</body>
</html>
