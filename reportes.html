<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reportes · Tostado</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-title="Reportes">
<main id="app">
<div class="page-head"><div><h1>Reportes</h1><p>Análisis de ventas y desempeño</p></div><button class="btn secondary">Exportar PDF</button></div>
<div class="card" style="margin-bottom:1.25rem"><div class="filters" style="margin:0"><select><option>Últimos 7 días</option><option>Últimos 30 días</option><option>Este año</option></select><input type="date"><input type="date"><button class="btn">Aplicar</button></div></div>
<div class="grid cols-3">
<div class="card stat"><div class="label">Ventas totales</div><div class="value">$31,450</div><div class="delta">▲ 9%</div></div>
<div class="card stat"><div class="label">Pedidos</div><div class="value">936</div><div class="delta">▲ 5%</div></div>
<div class="card stat"><div class="label">Propinas</div><div class="value">$2,310</div><div class="delta down">▼ 1%</div></div>
</div>
<div class="grid cols-2" style="margin-top:1.25rem">
<div class="card"><h3>Ventas por mes</h3><div class="chart-wrap"><div class="chart"><div style="height:40%"><span>Ene</span></div><div style="height:55%"><span>Feb</span></div><div style="height:50%"><span>Mar</span></div><div style="height:70%"><span>Abr</span></div><div style="height:85%"><span>May</span></div><div style="height:100%"><span>Jun</span></div></div></div></div>
<div class="card"><h3>Productos más vendidos</h3><table><thead><tr><th>Producto</th><th>Unidades</th><th>Ingresos</th></tr></thead><tbody>
<tr><td>Capuchino</td><td>312</td><td>$1,404</td></tr><tr><td>Latte</td><td>268</td><td>$1,286</td></tr><tr><td>Croissant</td><td>201</td><td>$703</td></tr><tr><td>Cheesecake</td><td>142</td><td>$781</td></tr></tbody></table></div>
</div>
</main>
<script src="js/app.js"></script>
</body>
</html>
